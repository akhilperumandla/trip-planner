<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Trip Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#edf1e9;--card:#fff;--tx:#1b211c;--mu:#7a867c;--ac:#517551;--soft:#e4ece1;--bd:#e3eae0;--bad:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:auto;padding:14px 16px 118px}
h1,h2,h3,.code,.deg{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:400;margin:0}
h1{font-size:40px;line-height:1.08}h1 em{color:var(--ac);font-style:normal}
h2{font-size:22px;line-height:1.1}h3{font-size:19px}
small,.mu{color:var(--mu)}small{font-size:12px}
svg{display:block;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 16px rgba(60,90,60,.08)}
.cb{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 12px rgba(60,90,60,.12);display:grid;place-items:center;color:var(--tx);cursor:pointer}
.top,.bar,.sp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{margin-bottom:10px}.bar .bt{flex:1;min-width:0}
.hero{position:relative;aspect-ratio:1.28;margin:0 -16px;padding:22px 16px 0}
.ha{position:absolute!important;inset:0;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 22%),linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
.ha svg,.art svg,.thumb svg{display:block;width:100%;height:100%}.dc>.art{position:absolute!important;inset:0;z-index:0}
.hero>*{position:relative}.hero p{margin:10px 0 0;max-width:210px;color:#3a463d;font-size:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:32px;padding:6px 6px 6px 18px;box-shadow:0 4px 20px rgba(60,90,60,.14);margin:-26px 0 6px;position:relative;color:var(--mu)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:#f6f8f4;color:var(--tx);font:inherit;min-width:0}
.search input{border:0;background:none;outline:0;padding:10px 0}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer}
textarea{min-height:150px;resize:vertical}
label{display:block;font-size:12px;color:var(--mu)}
button{font:inherit;color:inherit;cursor:pointer}
.pri{background:var(--ac);color:#fff;border:0;border-radius:16px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.wide{width:100%;margin:10px 0;padding:15px}
.x{background:none;border:0;color:var(--mu);padding:4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.g>:nth-child(-n+2){grid-column:span 2}
.add{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.add input,.add select{flex:1 1 100px}.add input[type=time]{flex:0 0 108px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}.hd a{color:var(--ac);font-weight:500;cursor:pointer}
.scr{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.scr.all{flex-wrap:wrap}
.dc{flex:none;width:calc(33.3% - 7px);min-width:108px;aspect-ratio:.78;border-radius:20px;color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;border:0;text-align:left;overflow:hidden}
.dc::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55))}
.dc>*{position:relative;z-index:1}.dc b{font-size:14px;font-weight:600;padding-right:28px;line-height:1.2}.dc small{color:#ffffffcc;font-size:11px}
.dc .ar{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--tx);display:grid;place-items:center;z-index:1}
.dc .gi{position:absolute;top:12px;left:12px;opacity:.55;z-index:1}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.qa button{background:none;border:0;font-size:11px;color:var(--mu);padding:0}
.qa span{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 6px;background:var(--card);border-radius:20px;box-shadow:0 2px 12px rgba(60,90,60,.1);color:var(--ac)}
.ban{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:22px;padding:14px 16px;margin:16px 0}.ban>div{flex:1}.ban b{font-weight:500}
.ban .ic{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;border:0}
.res{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:10px 14px;margin:6px 0;color:var(--ac)}.res span{flex:1;min-width:0;color:var(--tx)}
.pill{display:inline-block;background:var(--soft);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:6px}
.th{display:flex;justify-content:space-between;gap:12px;margin:8px 0}
.thumb{overflow:hidden;flex:none;width:118px;height:88px;border-radius:16px;background:var(--soft) center/cover;display:grid;place-items:center;color:var(--ac)}
.okc{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#f1f5ee;border-radius:16px;padding:12px 4px;margin-top:12px}
.stats div{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--ac)}.stats b{display:block;font-size:15px;color:var(--tx);font-weight:500}.stats small{display:block;font-size:11px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 6px}
.tabs button{flex:none;border:0;border-radius:22px;padding:9px 18px;background:none;color:var(--mu)}.tabs .on{background:var(--ac);color:#fff;font-weight:500}
.day{display:flex;gap:10px;position:relative}
.dn{flex:none;width:36px;text-align:center;padding-top:16px;position:relative}.dn small{display:block;font-size:11px}
.dn b{display:grid;place-items:center;width:32px;height:32px;margin:2px auto;border-radius:50%;background:#e3ebe0;color:var(--ac);font-weight:600}
.day.now .dn b{background:var(--ac);color:#fff}
.day:not(:last-child) .dn::after{content:"";position:absolute;left:17px;top:66px;bottom:-24px;border-left:2px dotted #b9c9b6}
.day>.card{flex:1;min-width:0;margin:8px 0}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-of-type{border-bottom:0}
.row span{flex:1;min-width:0;word-break:break-word}
.row a{color:var(--ac);display:flex}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;padding:0;border:2px solid #b9c9b6;border-radius:50%;background:none;flex:none;position:relative}
.row input:checked{background:var(--ac);border-color:var(--ac)}
.row input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.dne{text-decoration:line-through;color:var(--mu)}
.bar2{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:6px}
.pass{border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 2px 16px rgba(60,90,60,.1);margin:12px 0}
.ph{background:var(--ac);color:#fff;padding:12px 18px 18px;font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px}.ph em{font-style:normal;background:#ffffff33;border-radius:12px;padding:2px 10px;margin-left:auto}
.pb{background:var(--card);border-radius:22px 22px 0 0;margin-top:-12px;padding:16px 18px 6px;position:relative}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-size:34px;line-height:1.1}.mid{flex:1;display:flex;align-items:center;gap:4px;color:var(--ac)}.mid i{flex:1;border-top:2px dotted #b9c9b6}
.pf{display:flex;gap:22px;align-items:center;padding:12px 0;margin-top:12px;border-top:1px dashed #cdd8ca}.pf b{display:block;font-weight:500}.pf button{margin-left:auto}
.hot{display:flex;align-items:center;gap:14px}.hot>div:nth-child(2){flex:1;min-width:0}.hot b{display:block;font-weight:500;font-size:15px}
.hi{width:60px;height:60px;border-radius:16px;background:var(--soft);color:var(--ac);display:grid;place-items:center;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin:0}
.deg{font-size:34px;line-height:1.1}
.ck{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--mu);font-size:12px}.ck i{width:16px;height:16px;border-radius:50%;background:var(--ac);display:inline-grid;place-items:center;color:#fff}.ck i.o{background:none;border:1.5px solid #b9c9b6}
nav{z-index:20;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(60,90,60,.12);display:flex;padding:8px 8px env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:#98a39a;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac);font-weight:600}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}#toast.on{opacity:1}

body.out nav{display:none}
.scr{scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;user-select:none;-webkit-user-select:none;cursor:grab;scroll-behavior:smooth}
.scr::-webkit-scrollbar{display:none}.scr.drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}.dc{scroll-snap-align:start}
.sw{position:relative}.sa{display:none;position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 12px rgba(60,90,60,.2);place-items:center;z-index:3;color:var(--tx)}.sa.l{left:-8px}.sa.r{right:-8px}
@media(hover:hover){.sa{display:grid}.sw.all .sa{display:none}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:6px;height:6px;border-radius:6px;background:#c5d2c2;transition:.2s}.dots i.on{width:18px;background:var(--ac)}
.hero.sm{aspect-ratio:1.7}.hero.sm h1{font-size:36px}
.auth{margin-top:-6px}.auth label{margin-bottom:12px}.err{color:var(--bad);font-size:13px;min-height:18px}
.pw{position:relative}.pw input{padding-right:44px}.pw .x{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.lnk{background:none;border:0;color:var(--ac);font-weight:600;padding:0}
.cb.av{background:var(--ac);color:#fff;font-weight:600;font-size:17px}
.add input[type=date]{flex:0 0 142px}
@media(min-width:768px){.hero{aspect-ratio:2.2;padding-top:30px}.hero.sm{aspect-ratio:2.6}main{max-width:760px}h1{font-size:54px}.hero p{font-size:16px;max-width:300px}.hero.sm h1{font-size:46px}nav{max-width:760px;margin:0 auto}.two{gap:16px}}
@media(max-width:360px){.two{grid-template-columns:1fr}h1{font-size:34px}}

@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(3deg)}}
.lf{animation:sway 5s ease-in-out infinite}.lf.b{animation-duration:6.5s;animation-delay:-2s}.lf.c{animation-duration:4.2s;animation-delay:-1s}
@keyframes drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.mist{animation:drift 16s ease-in-out infinite}.mist.m2{animation-duration:22s;animation-direction:reverse}
@keyframes cross{0%{transform:translateX(-80px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(340px);opacity:0}}
.boat{animation:cross 48s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(1.6px) rotate(1.5deg)}}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes flow{to{stroke-dashoffset:-100}}
.shim{stroke-dasharray:18 32;animation:flow 6s linear infinite}.shim.s2{animation-duration:9s;animation-direction:reverse}
@keyframes wob{0%,100%{transform:skewX(-2deg);opacity:.18}50%{transform:skewX(2deg);opacity:.32}}
.refl{animation:wob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.95}}.spark{animation:tw 3s ease-in-out infinite}
@keyframes fly{0%{transform:translate(-30px,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(440px,-26px);opacity:0}}
.bird{animation:fly 24s linear infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
.bird path{animation:flap .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:.95;transform:scale(1.08)}}
.sun{animation:glow 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cld{to{transform:translateX(520px)}}.cloud{animation:cld 90s linear infinite}
@media(prefers-reduced-motion:reduce){.ha *{animation:none!important}}
.ft{background:var(--card);border-radius:22px;padding:20px 18px 14px;margin:28px 0 8px;box-shadow:0 2px 16px rgba(60,90,60,.08)}
.ft p{margin:4px 0 12px}.ft a{display:flex;align-items:center;gap:14px;padding:11px 0;color:var(--tx);text-decoration:none;border-top:1px solid var(--bd)}
.ft a b{display:block;font-weight:500;word-break:break-all}.ft a>div{flex:1;min-width:0}
.fi{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--ac);display:grid;place-items:center;flex:none}
.cp{display:block;text-align:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--bd)}
</style>
</head>

  (addB?`<div class="card"><h3>Add booking</h3><div class="add"><select class="k"><option>Flight</option><option>Hotel</option><option>Other</option></select><input class="a" placeholder="From (HYD) / Hotel name"><input class="b" placeholder="To (DPS) / details"><input class="d" type="date"><input class="t" type="time"><input class="r" placeholder="Flight no. / confirmation"><input class="g" placeholder="Gate"><input class="s" placeholder="Seat"><button class="pri" data-act="addBook">Save</button></div></div>`:'')+
  `<div class="two"><div class="card"><small>Weather in ${esc(place()||'your trip')}</small><div class="sp" style="align-items:flex-start"><div><div class="deg">${w.t}</div><div>${w.l}</div></div><span style="color:var(--ac)">${ic(w.i,34,1.5)}</span></div><small>${w.r}</small></div>
  <div class="card"><small>Trip Progress</small><div class="sp" style="margin-top:8px">${ring(p,72)}<div><b style="font-weight:500">${Math.round(p)}%</b><br><small>Completed</small></div></div></div></div>
  <div class="card" data-tab="plan" data-sub="pack" style="cursor:pointer"><div class="sp"><b style="font-weight:500">Packing Checklist</b><small>${np} of ${S.pack.length} packed</small>${ic('chev',18)}</div><div class="bar2"><i style="width:${S.pack.length?np/S.pack.length*100:0}%"></i></div>${S.pack.slice(0,3).map(i=>`<div class="ck"><i class="${i.done?'':'o'}">${i.done?ic('check',10,3.5):''}</i>${esc(i.t)}</div>`).join('')}</div>
  <div class="sp" style="margin-top:12px"><button class="pri wide" style="margin:0" data-act="addB">${ic('plus',20)} Add Booking</button>${cb('share','share')}</div>`;
}
function me(){
  const T=S.trip;
  return bar('Profile','Account & trip settings','')+`<div class="card sp"><div class="sp" style="justify-content:flex-start"><span class="cb av" style="box-shadow:none">${esc(U.name.trim()[0].toUpperCase())}</span><div><b>${esc(U.name)}</b><br><small>${esc(U.email)}</small></div></div><button class="pri" style="background:var(--soft);color:var(--ac);padding:10px 14px" data-act="logout">${ic('logout',18)} Log out</button></div>`+`<div class="card"><div class="g"><input id="tn" placeholder="Trip name" value="${esc(T.name)}"><input id="td" placeholder="Destination (e.g. Bali, Indonesia)" value="${esc(T.dest)}"><label>Start<input id="ts" type="date" value="${T.start}"></label><label>End<input id="te" type="date" value="${T.end}"></label><label>Total budget<input id="tb" type="number" inputmode="decimal" value="${T.budget||''}"></label><label>Currency<input id="tc" value="${esc(T.cur)}"></label></div><button class="pri wide" style="margin:0" data-act="saveTrip">Save trip</button></div>
  <div class="card"><h3>Notes</h3><textarea id="nt" placeholder="Addresses, emergency contacts, reminders\u2026" style="margin-top:10px">${esc(S.notes)}</textarea></div>`;
}

// ===== Cloud sync (Firebase) =====
let fb=null,unsub=null,booting=CLOUD,dirty=false,pushT=null,pendingName='',lastJ='';
const cloudOn=()=>!!(CLOUD&&fb);
const ser=()=>JSON.stringify(S,(k,v)=>k==='wx'?undefined:v);
const loadJS=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function initCloud(){
  try{const b='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadJS(b+'firebase-app-compat.js');await loadJS(b+'firebase-auth-compat.js');await loadJS(b+'firebase-firestore-compat.js');
    firebase.initializeApp(CFG);fb={auth:firebase.auth(),db:firebase.firestore()};
    fb.auth.onAuthStateChanged(onAuth,()=>{});
  }catch(e){fb=null;booting=false;const s=jget(SK,null);if(s&&users[s]){U=users[s];S=load(U)}toast('Cloud unavailable. Using this device only.');render()}
}
async function onAuth(user){
  booting=false;if(unsub){unsub();unsub=null}
  if(!user){U=null;S=blank();render();return}
  U={id:user.uid,name:user.displayName||pendingName||(user.email||'Traveller').split('@')[0],email:user.email,cloud:true};
  const ref=fb.db.collection('users').doc(user.uid);
  try{const snap=await ref.get();
    if(snap.exists&&snap.data().json){S=norm(JSON.parse(snap.data().json));lastJ=ser()}
    else{const lu=users[user.email],old=(lu&&jget(dk(lu),null))||jget(KEY,null);S=norm(old);if(old){try{localStorage.removeItem(KEY)}catch(x){}}dirty=true;await push(true)}
    unsub=ref.onSnapshot(sn=>{if(!sn.exists||dirty)return;const j=sn.data().json;if(!j||j===ser())return;const w=S.wx;S=norm(JSON.parse(j));S.wx=w;lastJ=ser();if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()});
  }catch(e){S=norm(jget('tp_cloud_'+user.uid,null));toast('Offline: showing your last saved copy')}
  tab='home';hist=[];addB=false;render();window.scrollTo(0,0);
}
async function push(now){
  if(!(U&&U.cloud&&fb))return;
  const run=async()=>{const j=ser();if(j===lastJ){dirty=false;return}try{await fb.db.collection('users').doc(U.id).set({name:U.name,email:U.email,json:j,updated:Date.now()});lastJ=j;dirty=false}catch(e){}};
  clearTimeout(pushT);if(now)return run();pushT=setTimeout(run,700)}
const fbMsg=e=>({'auth/email-already-in-use':'An account with this email already exists. Please log in.','auth/invalid-email':'Enter a valid email address.','auth/weak-password':'Password must be at least 8 characters.','auth/wrong-password':'Incorrect email or password.','auth/user-not-found':'Incorrect email or password.','auth/invalid-credential':'Incorrect email or password.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'No internet connection.'}[e&&e.code]||'Something went wrong. Please try again.');
async function regCloud(n,e,p){pendingName=n;try{const c=await fb.auth.createUserWithEmailAndPassword(e,p);try{await c.user.updateProfile({displayName:n})}catch(x){}if(U){U.name=n;await push(true)}toast('Welcome, '+n.split(' ')[0]+'!')}catch(x){pendingName='';aerr(fbMsg(x))}}
async function loginCloud(e,p){try{await fb.auth.signInWithEmailAndPassword(e,p)}catch(x){aerr(fbMsg(x))}}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},k,256))}
  let h=5381;const s=salt+pw;for(let r=0;r<2000;r++)for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return'x'+h}
const aerr=m=>{const e=$('#aerr');if(e)e.textContent=m};
function startSession(email){jset(SK,email);U=users[email];S=load(U);tab='home';hist=[];addB=false;render();window.scrollTo(0,0)}
async function doReg(){
  const n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,c=$('#ac').value;
  if(n.length<2)return aerr('Please enter your name.');
  if(!/^\S+@\S+\.\S+$/.test(e))return aerr('Enter a valid email address.');
  if(p.length<8)return aerr('Password must be at least 8 characters.');
  if(p!==c)return aerr('Passwords do not match.');
  if(cloudOn())return regCloud(n,e,p);
  if(users[e])return aerr('An account with this email already exists. Please log in.');
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const first=!Object.keys(users).length;
  users[e]={id:uid()+uid(),name:n,email:e,salt,hash:await hashPw(p,salt)};jset(UK,users);
  if(first){const old=jget(KEY,null);if(old){jset(dk(users[e]),old);try{localStorage.removeItem(KEY)}catch(x){}}}
  startSession(e);toast('Welcome, '+n.split(' ')[0]+'!')}
async function doLogin(){
  const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value;
  if(cloudOn())return loginCloud(e,p);
  if(Date.now()<lockUntil)return aerr('Too many attempts. Try again in a few seconds.');
  const u=users[e];
  if(!u||(await hashPw(p,u.salt))!==u.hash){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return aerr('Incorrect email or password.')}
  fails=0;startSession(e)}
function authView(){
  const reg=authMode==='reg';
  return `<div class="hero sm"><div class="ha">${ART.hero}</div><h1>${reg?'Create your<br><em>account.</em>':'Welcome<br><em>back.</em>'}</h1><p>${reg?'Save your trips and pick up where you left off.':'Log in to see your trips.'}</p></div>
  <div class="card auth">${reg?'<label>Name<input id="an" autocomplete="name"></label>':''}<label>Email<input id="ae" type="email" autocomplete="email" inputmode="email"></label>
  <label>Password<div class="pw"><input id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'At least 8 characters':''}"><button class="x" data-act="showpw" type="button">${ic('eye',18)}</button></div></label>
  ${reg?'<label>Confirm password<input id="ac" type="password" autocomplete="new-password"></label>':''}
  ${!reg&&cloudOn()?'<div style="text-align:right;margin-top:-4px"><button class="lnk" data-act="forgot" style="font-size:13px">Forgot password?</button></div>':''}<div class="err" id="aerr"></div><button class="pri wide" style="margin:6px 0 0" data-act="${reg?'doreg':'dologin'}">${reg?'Create account':'Log in'}</button>
  <p class="mu" style="text-align:center;margin:14px 0 0">${reg?'Already have an account?':'New here?'} <button class="lnk" data-act="authmode">${reg?'Log in':'Create account'}</button></p></div>
  <p class="mu" style="text-align:center"><small>${cloudOn()?'Your account and trips sync across all your devices.':'Your account and trips are stored on this device.'}</small></p>`}
function foot(){return `<footer class="ft"><h3>Contact Us</h3><p class="mu">Questions, feedback or partnerships? We'd love to hear from you.</p>
  <a href="tel:+919346291435"><span class="fi">${ic('phone',20)}</span><div><small>Mobile</small><b>+91 93462 91435</b></div>${ic('chev',18)}</a>
  <a href="https://instagram.com/randomclixcz" target="_blank" rel="noopener"><span class="fi">${ic('insta',20)}</span><div><small>Instagram</small><b>@randomclixcz</b></div>${ic('chev',18)}</a>
  <a href="mailto:thetripplannerone@gmail.com"><span class="fi">${ic('mail',20)}</span><div><small>Email</small><b>thetripplannerone@gmail.com</b></div>${ic('chev',18)}</a>
  <small class="cp">\u00a9 ${new Date().getFullYear()} Trip Planner. All rights reserved.</small></footer>`}
function render(){
  document.body.classList.toggle('out',!U);
  if(booting){$('#app').innerHTML='<p class="mu" style="text-align:center;margin-top:38vh">Loading...</p>';$('#nav').innerHTML='';return}
  if(!U){$('#app').innerHTML=authView()+foot();$('#nav').innerHTML='';return}
  $('#app').innerHTML=({home,plan,book,me})[tab]()+foot();
  $('#nav').innerHTML=[['home','home','Home'],['plan','cal','Itinerary'],['book','tix','Bookings'],['me','user','Profile']].map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'on':''}">${ic(x[1],24,tab===x[0]?2.2:1.7)}${x[2]}</button>`).join('');
  if(tab==='home'||tab==='book')loadWx();
}
function summary(){const T=S.trip;let s=(T.name||'My trip')+(T.dest?' - '+T.dest:'')+'\n';dates().forEach((d,i)=>{const l=(S.days[d]||[]).slice().sort(tsort);s+='\nDay '+(i+1)+' \u00b7 '+fmt(d)+'\n'+(l.map(x=>'\u2022 '+(x.t?x.t+' ':'')+x.n).join('\n')||'\u2022 -')});return s}
function route(){const dts=dates(),t=iso(new Date());let d=dts.includes(t)&&(S.days[t]||[]).length?t:dts.find(x=>(S.days[x]||[]).length);
  if(!d){toast('Add activities to a day first');return}
  const n=(S.days[d]).slice().sort(tsort).map(s=>s.n+' '+S.trip.dest),last=n.pop();
  const a=document.createElement('a');a.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(last)+(n.length?'&waypoints='+encodeURIComponent(n.join('|')):'');a.target='_blank';a.rel='noopener';a.click()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;const D=b.dataset;
  if(moved&&e.target.closest('.scr')){moved=false;return}
  if(D.tab&&!D.act){if(b.closest('nav'))hist=[];else if(tab!==D.tab)hist.push(tab);tab=D.tab;if(D.sub)sub=D.sub;addB=false;render();window.scrollTo(0,0);return}
  let rf='';const a=D.act,d=D.d,id=D.id,box=b.closest('.add'),v=c=>box&&box.querySelector(c)?box.querySelector(c).value.trim():'';
  if(a==='forgot'){const e=(($('#ae')||{}).value||'').trim();if(!/^\S+@\S+\.\S+$/.test(e)){aerr('Enter your email above first.');return}fb.auth.sendPasswordResetEmail(e).then(()=>{aerr('');toast('If an account exists, a reset link was emailed.')},x=>aerr(fbMsg(x)));return}
  if(a==='logout'&&U&&U.cloud){authMode='login';tab='home';hist=[];window.scrollTo(0,0);Promise.resolve(push(true)).finally(()=>fb.auth.signOut());return}
  if(a==='logout'){try{localStorage.removeItem(SK)}catch(x){}U=null;S=blank();authMode='login';tab='home';hist=[];render();window.scrollTo(0,0);return}
  if(a==='doreg'){doReg();return}
  if(a==='dologin'){doLogin();return}
  if(a==='authmode'){authMode=authMode==='reg'?'login':'reg';render();return}
  if(a==='showpw'){['#ap','#ac'].forEach(s=>{const i=$(s);if(i)i.type=i.type==='password'?'text':'password'});return}
  if(a==='sl'){const s=$('#scr');if(s)s.scrollBy({left:+d*s.clientWidth*.8,behavior:'smooth'});return}
  if(a==='back'){tab=hist.pop()||'home';addB=false;render();window.scrollTo(0,0);return}
  if(a==='route'){route();return}
  if(a==='share'){const s=summary();if(navigator.share)navigator.share({title:S.trip.name||'My trip',text:s}).catch(()=>{});else{try{navigator.clipboard.writeText(s).then(()=>toast('Trip summary copied'),()=>toast('Could not copy'))}catch(x){toast('Could not copy')}}return}
  if(a==='fq'){const R=window.SpeechRecognition||window.webkitSpeechRecognition,i=$('#q');
    if(R){try{const r=new R();r.lang='en-IN';r.onresult=ev=>{q=ev.results[0][0].transcript;if(i)i.value=q;$('#res').innerHTML=res()};r.onerror=()=>toast('Voice search is not available here');r.start();toast('Listening...')}catch(x){if(i)i.focus()}}else if(i)i.focus();return}
  if(a==='all'){allD=!allD}
  else if(a==='sub'){sub=d}
  else if(a==='addB'){addB=!addB}
  else if(a==='pick'){const x=DEST.find(z=>z[0]===d);S.trip.dest=x[0]+', '+x[1];if(!S.trip.name||/^Trip to /.test(S.trip.name))S.trip.name='Trip to '+x[0];S.wx=null;busy='';hist.push(tab);tab='me';toast('Now add your trip dates');window.scrollTo(0,0)}
  else if(a==='saveTrip'){const s0=$('#ts').value,e0=$('#te').value;if(s0&&e0&&e0<s0){toast('End date must be after the start date');return}S.trip={...S.trip,name:$('#tn').value.trim(),dest:$('#td').value.trim(),start:$('#ts').value,end:$('#te').value,budget:+$('#tb').value||0,cur:$('#tc').value};S.wx=null;busy='';tab='plan';hist=[];window.scrollTo(0,0)}
  else if(a==='addStop'){if(!v('.n'))return;(S.days[d]=S.days[d]||[]).push({id:uid(),t:v('.t'),n:v('.n'),done:false});rf='[data-act="addStop"][data-d="'+d+'"]'}
  else if(a==='tog'){const s=(S.days[d]||[]).find(x=>x.id===id);if(s)s.done=!s.done}
  else if(a==='delStop'){S.days[d]=(S.days[d]||[]).filter(x=>x.id!==id)}
  else if(a==='addExp'){const amt=+v('.m');if(!amt)return;S.exp.push({id:uid(),d:v('.d')||iso(new Date()),desc:v('.n')||'Expense',cat:v('.c')||'Other',amt});rf='[data-act="addExp"]'}
  else if(a==='delExp'){S.exp=S.exp.filter(x=>x.id!==id)}
  else if(a==='addBook'){if(!v('.a'))return;S.book.push({id:uid(),k:v('.k'),a:v('.a'),b:v('.b'),d:v('.d'),t:v('.t'),r:v('.r'),g:v('.g'),s:v('.s')});addB=false}
  else if(a==='delBook'){S.book=S.book.filter(x=>x.id!==id)}
  else if(a==='addP'){if(!v('.n'))return;S.pack.push({id:uid(),t:v('.n'),done:false});rf='[data-act="addP"]'}
  else if(a==='togP'){const p=S.pack.find(x=>x.id===id);if(p)p.done=!p.done}
  else if(a==='delP'){S.pack=S.pack.filter(x=>x.id!==id)}
  else if(a==='sample'){['ID / passport','Tickets & bookings','Phone + charger','Power bank','Wallet / cash','Medicines','Toiletries','Clothes','Sunglasses','Water bottle'].forEach(t=>{if(!S.pack.some(p=>p.t===t))S.pack.push({id:uid(),t,done:false})})}
  save();render();
  if(rf){const bt=document.querySelector(rf),i=bt&&bt.parentElement.querySelector('.n');if(i)i.focus({preventScroll:true})}
});
let dragEl=null,dx0=0,sl0=0;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.scr');if(!s||e.pointerType!=='mouse')return;dragEl=s;dx0=e.clientX;sl0=s.scrollLeft;moved=false});
document.addEventListener('pointermove',e=>{if(!dragEl)return;const dx=e.clientX-dx0;if(Math.abs(dx)>5){moved=true;dragEl.classList.add('drag');dragEl.scrollLeft=sl0-dx}});
document.addEventListener('pointerup',()=>{if(dragEl){dragEl.classList.remove('drag');dragEl=null}});
document.addEventListener('scroll',e=>{const s=e.target;if(!s||s.id!=='scr')return;const m=s.scrollWidth-s.clientWidth,p=m>0?Math.round(s.scrollLeft/m):0;document.querySelectorAll('#dots i').forEach((x,i)=>x.classList.toggle('on',i===p))},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const a=e.target.closest('.auth,.add');if(a&&e.target.tagName==='INPUT'){const p=a.querySelector('.pri');if(p)p.click()}});
document.addEventListener('input',e=>{
  if(e.target.id==='nt'){S.notes=e.target.value;save()}
  if(e.target.id==='q'){q=e.target.value;$('#res').innerHTML=res()}
});
render();
if(CLOUD)initCloud();
</script>
